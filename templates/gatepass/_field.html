<label class="field" for="{{ field.id_for_label }}">
  {{ field.label }}{% if not field.field.required %} <span class="hint-inline">optional</span>{% endif %}
  {{ field }}
  {% if hint %}<span class="hint">{{ hint }}</span>{% endif %}
  {% if field.errors %}<span class="field-error">{{ field.errors|striptags }}</span>{% endif %}
</label>
