{% extends "base.html" %}

{% block title %}Staff login{% endblock %}

{% block content %}
  <section class="panel narrow">
    <h1>Staff login</h1>
    <p>Security officers and administrators sign in here. Visitors do not need an account.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Log in</button>
    </form>
  </section>
{% endblock %}
